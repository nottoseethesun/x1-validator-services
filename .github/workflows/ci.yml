# .github/workflows/ci.yml
#
# Runs the gate, `npm run check`, on two majors in the project's range of
# Node.js versions, which `engines` gives: the oldest it allows, which
# validators run the features on, and the newest long-term-support major.
# check-latest has setup-node fetch the newest release of each major,
# not an older one the runner already holds. The gate runs code-fuzzing
# last, so a change to the code that its test doesn't catch fails the
# check, and with the branch protection on `main`, the merge too. Every
# version runs even when another fails.
#
# Each job's name says which version it's for, not the version's number,
# so when a newer major becomes long-term-support, only the numbers below
# move, and the checks the branch protection requires keep their names.

name: CI
run-name: CI on ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    # A run takes about three minutes, and GitHub's own limit is 6 hours.
    # The cap ends a hang that no test's time limit can, such as a test
    # file that leaves a timer running, and so never exits.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: check-oldest-nodejs-supported
            node-version: "24"
          - check: check-newest-nodejs-supported
            node-version: "26"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the gate
        run: npm run check
